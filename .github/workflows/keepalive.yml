name: keep-awake

# Keeps the Hugging Face Space (and the domain, once it points there) warm.
# HF Spaces sleep after ~48h idle, so this is light: a ping every 10 min inside
# a long-running job, scheduled every 6h with overlap.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping loop
        run: |
          END=$((SECONDS + 20700))   # ~5h45m
          while [ $SECONDS -lt $END ]; do
            curl -fsS --max-time 60 https://redlightsoff5-rlotelemetry.hf.space/health >/dev/null || true
            curl -fsS --max-time 60 https://telemetry.redlightsoff.com/health   >/dev/null || true
            sleep 600
          done
