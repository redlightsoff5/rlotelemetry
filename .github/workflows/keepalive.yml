name: keep-render-awake

# Render's free plan sleeps the service after ~15 min idle, causing a ~60s
# cold start for the next visitor. This workflow pings the app every 10 min so
# it stays warm. Public repo => GitHub Actions minutes are free.

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 minutes (UTC)
  workflow_dispatch: {}          # allow manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake + keep awake (/health)
        run: curl -fsS --retry 2 --max-time 90 https://telemetry.redlightsoff.com/health || true
      - name: Pre-warm data (/warmup)
        run: curl -fsS --max-time 150 https://telemetry.redlightsoff.com/warmup || true
